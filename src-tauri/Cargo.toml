[package]
name = "starris-rust"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "starris_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 透明窗口依赖 macos-private-api；该 feature 必须留在主表——tauri-build 的清单校验只在主表
# 找不到 tauri 时才回退 target 表，且回退后无差别检查所有 target 段落，Windows 构建必报错。
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
chrono = "0.4"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
blake3 = "1"
mime_guess = "2"
office_oxide = "0.1.15"
docx-rs = "0.4.22"
pulldown-cmark = "0.13"
printpdf = { version = "0.12.8", default-features = false, features = ["html", "images", "png", "jpeg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
html-escape = "0.2"
base64 = "0.22"
percent-encoding = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.42", default-features = false }
# 客户端内置 MCP HTTP 服务：成熟 HTTP 栈 + 与 Tauri 相同的 tokio 运行时。
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time"] }
pdf-inspector = "1.25.2"

[target.'cfg(unix)'.dependencies]
# Unix 平台读取磁盘可用空间（附件统计）。
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows 平台读取磁盘可用空间（附件统计）；只启用文件系统子集，控制体积。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.dev]
# 只保留行号表：默认的全量 debug info 会把 target/debug 撑到几十 GB，
# 长跑（反复 build + test）时曾写满整块磁盘。
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
